<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EDC15M редактор карт</title>
<style>
/* Layout: toolbar on top, item list on the left, editor on the right */
:root{
  --bg:#eef1f3; --panel:#ffffff; --fg:#18222b; --muted:#5d6a75; --line:#d3dade; --accent:#0e6b86; --accent-soft:#d8ebf1;
  --chg:#b45f06; --chg-soft:#fbe9d2; --bad:#b3262b; --bad-soft:#f8dada; --ok:#2c7a3d; --ok-soft:#dcefe0; --sel:#1d63c9;
  --heat:14,107,134;
  --mono:Consolas,"Cascadia Mono","DejaVu Sans Mono",Menlo,monospace; --sans:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#12181d; --panel:#1a232a; --fg:#e2e8ec; --muted:#93a1ab; --line:#2c3943; --accent:#5fb7d1; --accent-soft:#18394a;
  --chg:#f0a75a; --chg-soft:#3d2a14; --bad:#f08a8e; --bad-soft:#40191b; --ok:#7fc88d; --ok-soft:#183121; --sel:#6aa4ff; --heat:95,183,209; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--sans);display:grid;grid-template-rows:auto 1fr;}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:4px 7px}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.mono{font-family:var(--mono)}
header{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
header .grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
header .title{font-weight:600;margin-right:6px}
.status{font-size:12.5px;color:var(--muted);display:flex;gap:4px 14px;flex-wrap:wrap}
.status b{color:var(--fg);font-weight:500}
main{display:grid;grid-template-columns:340px 1fr;min-height:0}
aside{border-right:1px solid var(--line);display:grid;grid-template-rows:auto auto 1fr;min-height:0;background:var(--panel)}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{border:0;border-radius:0;flex:1;padding:8px 4px;background:transparent;border-bottom:2px solid transparent}
.tabs button.on{border-bottom-color:var(--accent);font-weight:600}
.filt{padding:8px;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.filt input{flex:1 1 140px}
.list{overflow:auto;min-height:0}
.item{padding:6px 10px;border-bottom:1px solid var(--line);cursor:pointer;display:grid;gap:1px}
.item:hover{background:var(--accent-soft)}
.item.on{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.item .l1{display:flex;gap:6px;align-items:center;font-family:var(--mono);font-size:12.5px}
.item .l2{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font:11px var(--mono);padding:0 6px;border-radius:8px;border:1px solid var(--line);color:var(--muted)}
.pill.H{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.M{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill.L{background:var(--chg-soft);color:var(--chg);border-color:transparent}
.pill.chg{background:var(--chg);color:#fff;border-color:transparent}
.pill.new{background:var(--sel);color:#fff;border-color:transparent}
section.ed{overflow:auto;padding:14px 16px;display:grid;gap:12px;align-content:start;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:12px;display:grid;gap:8px;min-width:0}
h2{margin:0;font-size:18px;font-weight:600}
h3{margin:0;font-size:15px;font-weight:600}
.meta{font:12.5px var(--mono);color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 16px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.note{font-size:12.5px;color:var(--muted)}
.warn{background:var(--bad-soft);color:var(--bad);border-radius:4px;padding:6px 10px;font-size:13px}
.info{background:var(--accent-soft);border-radius:4px;padding:6px 10px;font-size:13px}
.pair{display:flex;gap:12px;flex-wrap:nowrap;align-items:flex-start}
.side{display:grid;gap:4px;min-width:0;flex:0 1 auto;max-width:50%}
.side:only-child{max-width:100%}
@media (max-width:900px){.pair{flex-wrap:wrap}.side{max-width:100%}}
.gridwrap{overflow:auto;max-height:62vh;border:1px solid var(--line);border-radius:4px}
table.g.cmp td{cursor:default}
table.g{border-collapse:collapse;font:12px var(--mono);font-variant-numeric:tabular-nums;user-select:none}
table.g th,table.g td{border:1px solid var(--line);padding:3px 6px;text-align:right;white-space:nowrap}
table.g th{background:var(--bg);position:sticky;top:0;z-index:1}
table.g th.rh{position:sticky;left:0;z-index:1}
table.g th.corner{left:0;z-index:2;text-align:left;color:var(--muted);font-weight:400}
table.g td{cursor:cell;min-width:52px}
table.g td.chg{outline:2px solid var(--chg);outline-offset:-2px;font-weight:600}
table.g td.lim{color:var(--bad);font-weight:700}
table.g td.sel{box-shadow:inset 0 0 0 2px var(--sel)}
table.g td.chg.sel{outline:none}
table.g td input{width:70px;padding:0 2px;font:12px var(--mono)}
.ops{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ops input{width:90px}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
table.t th{color:var(--muted);font-weight:600}
table.t td.n{font-family:var(--mono);white-space:nowrap}
.form{display:grid;grid-template-columns:150px 1fr;gap:6px 10px;align-items:center}
.form .full{grid-column:1/-1}
.form input,.form select,.form textarea{width:100%}
.axrow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.empty{color:var(--muted);padding:30px 6px;text-align:center}
@media (max-width:800px){main{grid-template-columns:1fr;grid-template-rows:45vh 1fr}aside{border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<header>
  <span class="title">EDC15M · редактор карт</span>
  <div class="grp"><label for="lang" class="mono">Language / Язык:</label><select id="lang"><option value="en">English</option><option value="ru">Русский</option></select></div>
  <div class="grp"><a href="https://github.com/Blianahui/EDC15M-editor" target="_blank" rel="noopener" class="mono" style="color:var(--accent)">GitHub</a></div>
  <div class="grp">
    <label class="mono" for="fMain">Прошивка:</label><input type="file" id="fMain">
    <label class="mono" for="fCmp">Сравнить с (сток):</label><input type="file" id="fCmp">
  </div>
  <div class="grp">
    <button id="bUndo" title="Ctrl+Z">Отменить</button><span class="note" id="undoN"></span>
    <button id="bChk" class="pri">Пересчитать сумму</button>
    <button id="bChkCheck">Проверить сумму</button>
    <button id="bSave">Сохранить файл</button>
    <button id="bCsv">CSV изменений</button>
  </div>
  <div class="grp">
    <label for="ecuSel" class="mono">Блок:</label><select id="ecuSel"><option value="frontera">Opel Frontera X22DTH · 0281001791</option><option value="terrano550">Nissan Terrano 2.7 TDi · 0281001550</option></select>
    <label for="fDefs" class="mono">Описания:</label><input type="file" id="fDefs">
    <button id="bDefsSave">Сохранить описания</button>
    <button id="bDefsReset">Встроенные</button>
  </div>
  <div class="status" id="status"></div>
</header>
<main>
  <aside>
    <div class="tabs" role="tablist">
      <button data-tab="maps" class="on">Карты</button><button data-tab="scal">Значения</button><button data-tab="scan">Поиск</button><button data-tab="log">Журнал</button>
    </div>
    <div class="filt" id="filt">
      <input id="q" type="search" placeholder="адрес, название, задача">
      <select id="qConf"><option value="">все</option><option>H</option><option>M</option><option>L</option></select>
      <label class="note"><input type="checkbox" id="qChg"> только изменённые</label>
    </div>
    <div class="list" id="list"></div>
  </aside>
  <section class="ed" id="ed"><div class="empty">Откройте файл прошивки (256 КБ). Для подсветки изменений откройте и стоковый файл в поле «Сравнить с».</div></section>
</main>

<script>
'use strict';
const CAL_LO=0x38000, CAL_HI=0x40000, FSIZE=0x40000;
const LS_KEY='edc15m_defs_v1';
const ECUS={frontera:{el:'defsBuiltin',ls:'edc15m_defs_v1',name:'Opel Frontera X22DTH 0281001791'},
            terrano550:{el:'defsBuiltinTerrano',ls:'edc15m_defs_v1_terrano550',name:'Nissan Terrano 2.7 TDi 0281001550'}};
let ECU='frontera';
const S={main:null,mainName:'',cmp:null,cmpName:'',defs:null,tab:'maps',cur:null,sel:null,undo:[],log:[],raw:false,diffPct:false,scan:null,temp:null,editDef:false};
const $=s=>document.querySelector(s);
const hex=(n,w=5)=>'0x'+n.toString(16).toUpperCase().padStart(w,'0');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function U16(b,a){return b[a]|(b[a+1]<<8)}
function S16(b,a){const v=U16(b,a);return v>=0x8000?v-0x10000:v}
function rd(b,a,signed){return signed?S16(b,a):U16(b,a)}
function parseAddr(s){s=String(s).trim().replace(/^0x/i,'');if(!/^[0-9a-f]+$/i.test(s))return NaN;return parseInt(s,16)}
function lsGet(){try{return localStorage.getItem(ECUS[ECU].ls)}catch(e){return null}}
function lsSet(v){try{localStorage.setItem(ECUS[ECU].ls,v)}catch(e){}}

/* ---------- map header parsing: [Xid][nx][X..][Yid][ny][Y..][data], data X-major ---------- */
function axisAt(b,a){
  if(a+2>b.length) return null;
  const n=U16(b,a); if(n<2||n>32||a+2+2*n>b.length) return null;
  for(const signed of [false,true]){
    const v=[];for(let i=0;i<n;i++)v.push(rd(b,a+2+2*i,signed));
    let ok=true;for(let i=0;i<n-1;i++)if(!(v[i]<v[i+1])){ok=false;break}
    if(ok) return {n,v,signed};
  }
  return null;
}
const isVar=v=>v>=0xC000||v===0;
function parseHeader(b,h){
  if(h<CAL_LO||h+6>CAL_HI||h%2) return null;
  const xv=U16(b,h); if(!isVar(xv)) return null;
  const ax=axisAt(b,h+2); if(!ax) return null;
  const p=h+4+2*ax.n; const yv=U16(b,p);
  const ay=isVar(yv)?axisAt(b,p+2):null;
  if(ay){const data=p+4+2*ay.n;const end=data+2*ax.n*ay.n;if(end>CAL_HI)return null;return {h,kind:'2D',xv,X:ax.v,nx:ax.n,yv,Y:ay.v,ny:ay.n,data,end}}
  const end=p+2*ax.n; if(end>CAL_HI) return null;
  return {h,kind:'1D',xv,X:ax.v,nx:ax.n,yv:null,Y:null,ny:1,data:p,end};
}
/* resolve a definition against the current file -> geometry */
function geom(def,b){
  const a=parseAddr(def.addr);
  if(def.kind==='scalar') return {kind:'scalar',data:a,end:a+2,nx:1,ny:1};
  if(def.kind==='raw'){const nx=+def.nx||1,ny=+def.ny||1;return {kind:'raw',data:a,end:a+2*nx*ny,nx,ny,X:[...Array(nx).keys()],Y:ny>1?[...Array(ny).keys()]:null}}
  const g=parseHeader(b,a); if(!g) return null;
  return g;
}

/* ---------- values ---------- */
function phys(v,s){s=s||{scale:1,offset:0};const sc=+s.scale||1;return v/sc+(+s.offset||0)}
function toRaw(p,s){s=s||{scale:1,offset:0};const sc=+s.scale||1;return Math.round((p-(+s.offset||0))*sc)}
function fmt(p,s){const sc=+(s&&s.scale)||1;const dec=sc>=10000?3:sc>=100?2:sc>=10?1:0;return (Math.round(p*10**dec)/10**dec).toFixed(dec)}
function cellAddr(g,x,y){return g.data+2*(x*g.ny+y)}
function getCell(b,g,def,x,y){return rd(b,cellAddr(g,x,y),def.signed)}

/* ---------- write protection + undo ---------- */
function writeWords(changes,label){ // changes: [{a,v}] raw ints
  const bad=changes.filter(c=>c.a<CAL_LO||c.a+2>CAL_HI||c.a%2);
  if(bad.length){alert('Запись вне калибровки 0x38000–0x3FFFF запрещена: '+bad.map(c=>hex(c.a)).join(', '));return false}
  const ov=changes.filter(c=>c.v<-32768||c.v>65535);
  if(ov.length){alert('Значение вне 16 бит: '+ov.map(c=>hex(c.a)+'='+c.v).join(', '));return false}
  const prev=changes.map(c=>({a:c.a,v:U16(S.main,c.a)}));
  const real=[];
  for(const c of changes){const nv=c.v&0xFFFF;const ov2=U16(S.main,c.a);if(nv!==ov2){S.main[c.a]=nv&255;S.main[c.a+1]=nv>>8;real.push({a:c.a,old:ov2,nv})}}
  if(!real.length) return true;
  S.undo.push({label,prev}); if(S.undo.length>200)S.undo.shift();
  const t=new Date().toLocaleTimeString();
  S.log.push({t,label,n:real.length,first:real[0].a,detail:real.slice(0,400)});
  return true;
}
/* ---------- checksum (ECM Titanium family 1 / "TROIA", from EcmAlgoDLL.dll) ---------- */
function rol(x,n){n&=15;return n?(((x<<n)|(x>>(16-n)))&0xFFFF):(x&0xFFFF)}
function ror(x,n){n&=15;return n?(((x>>n)|(x<<(16-n)))&0xFFFF):(x&0xFFFF)}
const CK={K3:0x8631,K4:0xEFCD,iA:0x8631,iB:0xEFCD};
function ckFindBlocks(d){
  const blocks=[]; let off=0; const n=d.length;
  while(off+0xBC2<=n && blocks.length<100){
    if(d[off]===0x55&&d[off+1]===0x55&&d[off+2]===0&&d[off+3]===0&&d[off+4]===0x56&&d[off+5]===0x56
       && U16(d,off+0xB80)===0x14 && U16(d,off+0xBC0)===0x14){
      const Sb=off+0xB80, t0=d[Sb-6], t1=d[Sb-5]; let Q=Sb+0x40;
      while(Q<=n && !(Q-6>=0 && d[Q-6]===t0 && d[Q-5]===t1)) Q+=0x40;
      if(Q<=n && d[Q-6]===t0 && d[Q-5]===t1){
        const C=Q-4; blocks.push({start:Sb,C,tag:(t0|(t1<<8))});
        let nxt=Q; if(Q<0x8000) nxt=(Math.floor(Q/0x100)+1)*0x100; off=nxt; continue;
      }
    }
    off+=0x400;
  }
  return blocks;
}
function ckCompute(d,Sb,C){
  let A=CK.iA,B=CK.iB,c=1,p=Sb;
  while(p<=C){
    A^=U16(d,p);
    const Ab=A, s=B&15; A=rol(A,s);
    c=(s!==0&&Ab!==0)?(A&1):0;
    let t=B-U16(d,p+2)-c; c=t<0?1:0; B=t&0xFFFF;
    B^=A; c=1; p+=4;
    if(p===C) break;
    t=A-U16(d,p)-c; c=t<0?1:0; A=t&0xFFFF;
    A=(A+((p+2)&0x7FFF))&0xFFFF;
    B^=U16(d,p+2);
    B=ror(B,A&15);
    p+=4;
  }
  A=(A-CK.K3+((C+1)&0xFFF)+0x7000)&0xFFFF;
  B^=rol(CK.K4,CK.K3&15);
  return [A,B];
}
function ckScan(){
  let blocks=ckFindBlocks(S.main);
  let usedCfg=false;
  if(!blocks.length && S.defs && S.defs.ck){ blocks=[{start:S.defs.ck.start,C:S.defs.ck.C,tag:null}]; usedCfg=true; }
  return {blocks,usedCfg};
}
function recalcChecksum(checkOnly){
  if(!S.main){alert('Нет открытого файла');return}
  const {blocks,usedCfg}=ckScan();
  if(!blocks.length){alert('Блок контрольной суммы не найден (нет маркера 55 55 00 00 56 56). Файл не распознан.');return}
  const rep=[]; const changes=[];
  for(const b of blocks){
    const [A,B]=ckCompute(S.main,b.start,b.C);
    const sa=U16(S.main,b.C), sb=U16(S.main,b.C+2);
    const oknow=(A===sa&&B===sb);
    rep.push(`блок ${hex(b.start)}–${hex(b.C-1)} → ${hex(b.C)}: ${oknow?'уже верна':((hex(sa,4)+' '+hex(sb,4))+' → '+hex(A,4)+' '+hex(B,4))} (${A.toString(16).toUpperCase().padStart(4,'0')} ${B.toString(16).toUpperCase().padStart(4,'0')})`);
    if(!oknow){changes.push({a:b.C,v:A},{a:b.C+2,v:B});}
  }
  if(checkOnly){
    alert('Проверка контрольной суммы'+(usedCfg?' (по CFG, без маркера)':'')+':\n\n'+rep.join('\n')+'\n\n'+(changes.length?'ЕСТЬ расхождения — нажмите «Пересчитать сумму».':'Все блоки верны.'));
    return;
  }
  if(!changes.length){alert('Контрольная сумма уже верна, менять нечего.');return}
  if(writeWords(changes,'Пересчёт контрольной суммы ('+(changes.length/2)+' бл.)')){
    renderAll();
    alert('Контрольная сумма пересчитана'+(usedCfg?' (по CFG)':'')+':\n\n'+rep.join('\n')+'\n\nТеперь можно сохранять файл.');
  }
}
function undoOne(){const u=S.undo.pop();if(!u)return false;for(const c of u.prev){S.main[c.a]=c.v&255;S.main[c.a+1]=c.v>>8}S.log.push({t:new Date().toLocaleTimeString(),label:'Отмена: '+u.label,n:u.prev.length,first:u.prev[0]?.a??0,detail:[]});return true}
function undoN(n){let k=0;while(k<n&&undoOne())k++;if(!k)alert('Отменять нечего');renderAll()}
function undo(){undoN(1)}

/* ---------- defs ---------- */
function loadDefs(obj,src){
  if(!obj||!Array.isArray(obj.items)) throw new Error('Не похоже на файл описаний (нет items)');
  S.defs=obj; S.defs.items.forEach(d=>{d.addr=hex(parseAddr(d.addr))});
  sortDefs(); lsSet(JSON.stringify(S.defs)); S.cur=null; S.sel=null; checkOverlaps();
  setStatus(src);
}
function sortDefs(){S.defs.items.sort((a,b)=>parseAddr(a.addr)-parseAddr(b.addr))}
function builtinDefs(id){return JSON.parse($('#'+ECUS[id||ECU].el).textContent)}
function selectEcu(id,msg){
  ECU=ECUS[id]?id:'frontera'; const sel=$('#ecuSel'); if(sel) sel.value=ECU;
  try{localStorage.setItem('edc15m_ecu',ECU)}catch(e){}
  let d=null; const ls=lsGet(); if(ls){try{d=JSON.parse(ls)}catch(e){d=null}}
  try{loadDefs(d||builtinDefs(),d?'описания из прошлой сессии (браузер)':'встроенные описания')}catch(e){loadDefs(builtinDefs(),'встроенные описания')}
  S.scan=null; if(msg) setStatus(msg);
}
function ecuScore(id,b){
  const it=builtinDefs(id).items.filter(d=>d.kind==='1D'||d.kind==='2D'); if(!it.length) return 0;
  return it.filter(d=>geom(d,b)).length/it.length;
}
function detectEcu(b){
  const sc={}; for(const id in ECUS) sc[id]=ecuScore(id,b);
  const best=Object.keys(sc).sort((x,y)=>sc[y]-sc[x])[0];
  if(best!==ECU && sc[best]>=0.8 && sc[best]>sc[ECU]+0.2){ selectEcu(best,'Определён блок: '+ECUS[best].name); return true }
  return false;
}
function saveDefsLS(){lsSet(JSON.stringify(S.defs))}
function defByAddr(a){return S.defs.items.find(d=>parseAddr(d.addr)===a)}
let overlapWarn=[];
function checkOverlaps(){
  overlapWarn=[]; if(!S.main) return;
  const rs=S.defs.items.map(d=>{const g=geom(d,S.main);if(!g)return null;const s=d.kind==='scalar'||d.kind==='raw'?g.data:g.h;return {d,s,e:g.end}}).filter(Boolean).sort((a,b)=>a.s-b.s);
  for(let i=1;i<rs.length;i++) if(rs[i].s<rs[i-1].e) overlapWarn.push(rs[i-1].d.addr+' и '+rs[i].d.addr);
}
function itemChanged(d){
  if(!S.cmp||!S.main) return false; const g=geom(d,S.main); if(!g) return false;
  for(let a=g.data;a<g.end;a++) if(S.main[a]!==S.cmp[a]) return true; return false;
}

/* ---------- status ---------- */
function sum16(b){let s=0;for(let i=0;i<b.length;i++)s=(s+b[i])&0xFFFF;return s}
function diffCount(){if(!S.main||!S.cmp)return null;let n=0;for(let i=0;i<S.main.length;i++)if(S.main[i]!==S.cmp[i])n++;return n}
function setStatus(extra){
  const st=$('#status'); const p=[]; const un=$('#undoN'); if(un) un.textContent=S.undo.length?('шагов отмены: '+S.undo.length):'';
  if(S.main) p.push(`файл <b>${esc(S.mainName)}</b>`,`сумма байт (Galletto) <b class="mono">${sum16(S.main).toString(16).toUpperCase().padStart(4,'0')}</b>`);
  if(S.cmp) p.push(`сравнение <b>${esc(S.cmpName)}</b>`,`отличается байт: <b>${diffCount()}</b>`);
  p.push(`описаний: <b>${S.defs.items.length}</b>`);
  if(overlapWarn.length) p.push(`<span style="color:var(--bad)">перекрытие описаний: ${esc(overlapWarn.join('; '))}</span>`);
  if(extra) p.push(esc(extra));
  st.innerHTML=p.map(x=>'<span>'+x+'</span>').join('');
}

/* ---------- list ---------- */
function renderList(){
  const L=$('#list'); $('#filt').hidden=!(S.tab==='maps'||S.tab==='scal');
  if(S.tab==='log'){renderLogList();return}
  if(S.tab==='scan'){renderScanList();return}
  const q=$('#q').value.trim().toLowerCase(), cf=$('#qConf').value, oc=$('#qChg').checked;
  const items=S.defs.items.filter(d=>(S.tab==='scal')===(d.kind==='scalar'));
  let h='';
  for(const d of items){
    const hay=(d.addr+' '+(d.name||'')+' '+(d.tasks||'')+' '+(d.note||'')).toLowerCase();
    if(q&&!hay.includes(q))continue; if(cf&&d.conf!==cf)continue;
    const ch=itemChanged(d); if(oc&&!ch)continue;
    let size=d.kind; if(S.main&&d.kind!=='scalar'){const g=geom(d,S.main);size=g?`${g.kind} ${g.nx}×${g.ny}`:'<span style="color:var(--bad)">нет заголовка</span>'}
    h+=`<div class="item ${S.cur===d?'on':''}" data-a="${d.addr}"><div class="l1">${d.addr}<span>${size}</span><span class="pill ${d.conf||''}">${d.conf||'?'}</span>${ch?'<span class="pill chg">изм.</span>':''}</div><div class="l2" title="${esc(d.name)}">${esc(d.name||'(без названия)')}</div></div>`;
  }
  L.innerHTML=h||'<div class="empty">Ничего не найдено</div>';
  L.querySelectorAll('.item').forEach(e=>e.onclick=()=>{S.cur=defByAddr(parseAddr(e.dataset.a));S.temp=null;S.sel=null;S.editDef=false;renderAll()});
}
function renderLogList(){
  const L=$('#list');
  if(!S.log.length){L.innerHTML='<div class="empty">Изменений пока не было</div>';return}
  L.innerHTML=S.log.slice().reverse().map(e=>`<div class="item"><div class="l1">${e.t}<span>${e.n} сл.</span></div><div class="l2">${esc(e.label)}</div></div>`).join('');
}
function renderScanList(){
  const L=$('#list');
  if(!S.main){L.innerHTML='<div class="empty">Сначала откройте прошивку</div>';return}
  if(!S.scan) S.scan=scanAll(S.main);
  const known=new Set(S.defs.items.map(d=>parseAddr(d.addr)));
  L.innerHTML=`<div class="note" style="padding:8px">Все места калибровки, где читается корректный заголовок карты. Найдено ${S.scan.length}, из них без описания ${S.scan.filter(g=>!known.has(g.h)).length}. Без описания ≠ неиспользуемая: часть карт код берёт через указатели в ОЗУ.</div>`+
   S.scan.map(g=>`<div class="item ${S.temp&&S.temp.h===g.h?'on':''}" data-h="${g.h}"><div class="l1">${hex(g.h)}<span>${g.kind} ${g.nx}×${g.ny}</span>${known.has(g.h)?'<span class="pill">описана</span>':'<span class="pill new">новая</span>'}</div><div class="l2">${esc((defByAddr(g.h)||{}).name||'ось X '+hex(g.xv,4)+(g.yv!=null?', ось Y '+hex(g.yv,4):''))}</div></div>`).join('');
  L.querySelectorAll('.item').forEach(e=>e.onclick=()=>{const h=+e.dataset.h;const d=defByAddr(h);if(d){S.cur=d;S.temp=null}else{S.cur=null;S.temp=parseHeader(S.main,h)}S.sel=null;S.editDef=false;renderAll()});
}
function scanAll(b){
  const out=[];let a=CAL_LO;
  while(a<CAL_HI-8){const g=parseHeader(b,a);if(g&&(g.nx*g.ny>=2)){out.push(g);a=g.end;continue}a+=2}
  return out;
}

/* ---------- editor ---------- */
function renderEditor(){
  const E=$('#ed');
  if(S.tab==='log'){E.innerHTML=logView();bindLog();return}
  if(!S.main){E.innerHTML='<div class="empty">Откройте файл прошивки (256 КБ). Для подсветки изменений откройте и стоковый файл в поле «Сравнить с».</div>'+addMapCard();bindAdd();return}
  if(S.tab==='scal'){E.innerHTML=scalarView()+addMapCard();bindScalars();bindAdd();return}
  if(S.temp){E.innerHTML=tempView(S.temp)+addMapCard();bindTemp();bindAdd();return}
  if(!S.cur){E.innerHTML='<div class="empty">Выберите карту слева или добавьте новую.</div>'+addMapCard();bindAdd();return}
  E.innerHTML=mapView(S.cur)+defForm(S.cur)+addMapCard(); bindMap(); bindDefForm(); bindAdd();
}
function mapView(d){
  const g=geom(d,S.main);
  if(!g) return `<div class="card"><h2>${d.addr}</h2><div class="warn">По этому адресу в открытом файле нет корректного заголовка карты. Исправьте адрес в описании ниже или удалите описание.</div></div>`;
  const vs=d.v||{scale:1,offset:0}, xs=d.x||{scale:1,offset:0}, ys=d.y||{scale:1,offset:0};
  let lo=Infinity,hi=-Infinity;
  for(let x=0;x<g.nx;x++)for(let y=0;y<g.ny;y++){const v=getCell(S.main,g,d,x,y);lo=Math.min(lo,v);hi=Math.max(hi,v)}
  const span=(hi-lo)||1;
  const yh=g.Y?g.Y.map(v=>`<th>${S.raw?v:fmt(phys(v,ys),ys)}</th>`).join(''):'<th>значение</th>';
  let rows='';
  for(let x=0;x<g.nx;x++){
    let r=`<th class="rh">${S.raw?g.X[x]:fmt(phys(g.X[x],xs),xs)}</th>`;
    for(let y=0;y<g.ny;y++){
      const v=getCell(S.main,g,d,x,y); const a=cellAddr(g,x,y);
      const c=S.cmp?rd(S.cmp,a,d.signed):v; const ch=c!==v;
      const lim=(d.min!=null&&phys(v,vs)<+d.min)||(d.max!=null&&phys(v,vs)>+d.max);
      let txt=S.raw?String(v):fmt(phys(v,vs),vs);
      if(S.diffPct&&S.cmp) txt=ch?(c?((v/c-1)*100).toFixed(1)+'%':'∞'):'·';
      const tip=`${hex(a)}  сырое ${v}`+(ch?`\nбыло ${S.raw?c:fmt(phys(c,vs),vs)} (${c?((v/c-1)*100).toFixed(1):'—'} %)`:'')+(lim?'\nвне пределов описания':'');
      const sel=S.sel&&x>=S.sel.x0&&x<=S.sel.x1&&y>=S.sel.y0&&y<=S.sel.y1;
      r+=`<td data-x="${x}" data-y="${y}" class="${ch?'chg ':''}${lim?'lim ':''}${sel?'sel':''}" style="background:rgba(var(--heat),${(0.06+0.5*(v-lo)/span).toFixed(2)})" title="${esc(tip)}">${txt}</td>`;
    }
    rows+='<tr>'+r+'</tr>';
  }
  const corner=`X: ${esc(xs.unit||hex(g.xv,4))}${g.Y?' ↓ \\ Y: '+esc(ys.unit||hex(g.yv,4))+' →':''}`;
  const nsel=S.sel?(S.sel.x1-S.sel.x0+1)*(S.sel.y1-S.sel.y0+1):0;
  return `<div class="card">
   <div class="row" style="justify-content:space-between"><h2>${d.addr} <span class="pill ${d.conf}">${d.conf||'?'}</span></h2>
     <div class="row"><label class="note"><input type="checkbox" id="tRaw" ${S.raw?'checked':''}> сырые числа</label><label class="note"><input type="checkbox" id="tPct" ${S.diffPct?'checked':''} ${S.cmp?'':'disabled'}> разница в %</label></div></div>
   <div>${esc(d.name||'(без названия)')}</div>
   <div class="meta"><span>${g.kind} ${g.nx}×${g.ny}</span><span>данные ${hex(g.data)}–${hex(g.end-1)}</span>${g.h!=null?`<span>Titanium: ${hex(g.data-2)}</span>`:''}<span>значения: ${esc(vs.unit||'сырые')}${vs.scale&&vs.scale!=1?' (сырое / '+vs.scale+')':''}</span>${d.min!=null||d.max!=null?`<span>пределы ${d.min??'—'}…${d.max??'—'}</span>`:''}${d.tasks?`<span>задачи ${esc(d.tasks)}</span>`:''}</div>
   ${d.note?`<div class="info">${esc(d.note)}</div>`:''}
   <div class="ops">
     <span class="note">Выделено ячеек: <b>${nsel}</b></span>
     <button id="oAll">Выделить всё</button>
     <input id="oVal" type="text" inputmode="decimal" placeholder="число" aria-label="Число для операции">
     <button data-op="set">= задать</button><button data-op="sub">− убавить</button><button data-op="add">+ прибавить</button><button data-op="pct">± %</button>
     <button data-op="rev" ${S.cmp?'':'disabled'}>вернуть из сравнения</button>
   </div>
   <div class="note">Выделение: протяните мышью или Shift+клик. Двойной клик по ячейке — ввести значение. Если поле числа пустое, «+» и «−» прибавляют/убавляют 1. Числа операций в тех же единицах, что на экране (галочка «сырые числа» переключает). Для «± %» введите, например, 15 или −5.</div>
   <div class="pair">
    <div class="side"><div class="note">Редактируемый файл: ${esc(S.mainName)}</div><div class="gridwrap"><table class="g" id="grid"><tr><th class="corner">${corner}</th>${yh}</tr>${rows}</table></div></div>
    ${S.cmp?`<div class="side"><div class="note">Сравнение: ${esc(S.cmpName)}</div><div class="gridwrap"><table class="g cmp"><tr><th class="corner">${corner}</th>${yh}</tr>${cmpRows(d,g,xs,vs,lo,span)}</table></div></div>`:''}
   </div>
  </div>`;
}
function cmpRows(d,g,xs,vs,lo,span){
  let rows='';
  for(let x=0;x<g.nx;x++){
    let r=`<th class="rh">${S.raw?g.X[x]:fmt(phys(g.X[x],xs),xs)}</th>`;
    for(let y=0;y<g.ny;y++){
      const a=cellAddr(g,x,y); const c=rd(S.cmp,a,d.signed); const v=rd(S.main,a,d.signed); const ch=c!==v;
      r+=`<td class="${ch?'chg':''}" style="background:rgba(var(--heat),${(0.06+0.5*Math.min(1,Math.max(0,(c-lo)/span))).toFixed(2)})" title="${hex(a)}  сырое ${c}${ch?'\nв редактируемом '+(S.raw?v:fmt(phys(v,vs),vs)):''}">${S.raw?c:fmt(phys(c,vs),vs)}</td>`;
    }
    rows+='<tr>'+r+'</tr>';
  }
  return rows;
}
function selCells(){const g=geom(S.cur,S.main);const s=S.sel;const out=[];if(!s)return out;for(let x=s.x0;x<=s.x1;x++)for(let y=s.y0;y<=s.y1;y++)out.push({x,y,a:cellAddr(g,x,y)});return out}
function applyOp(op){
  const d=S.cur; if(!S.sel){alert('Сначала выделите ячейки');return}
  const vs=S.raw?{scale:1,offset:0}:(d.v||{scale:1,offset:0});
  const g=geom(d,S.main);
  let num=parseFloat(String($('#oVal').value).replace(',','.').replace('−','-'));
  if((op==='add'||op==='sub')&&String($('#oVal').value).trim()==='') num=1;
  if(op!=='rev'&&!isFinite(num)){alert('Введите число');return}
  const ch=[];
  for(const c of selCells()){
    const v=getCell(S.main,g,d,c.x,c.y); let nv;
    if(op==='rev') nv=U16(S.cmp,c.a);
    else if(op==='set') nv=toRaw(num,vs);
    else if(op==='add') nv=v+toRaw(num,{scale:vs.scale,offset:0});
    else if(op==='sub') nv=v-toRaw(num,{scale:vs.scale,offset:0});
    else if(op==='pct') nv=Math.round(v*(1+num/100));
    if(op!=='rev'){ if(d.signed&&(nv<-32768||nv>32767)){alert('Результат вне диапазона −32768…32767');return} if(!d.signed&&(nv<0||nv>65535)){alert('Результат вне диапазона 0…65535');return} }
    ch.push({a:c.a,v:nv});
  }
  const lbl=`${d.addr} ${op==='set'?'= '+num:op==='add'?'+ '+num:op==='sub'?'− '+num:op==='pct'?(num>=0?'+':'')+num+' %':'возврат из сравнения'} (${ch.length} яч.)`;
  if(writeWords(ch,lbl)) renderAll();
  const lim=limitHits(d); if(lim) alert(lim);
}
function limitHits(d){
  if(d.min==null&&d.max==null) return null; const g=geom(d,S.main); const vs=d.v||{}; let n=0;
  for(let x=0;x<g.nx;x++)for(let y=0;y<g.ny;y++){const p=phys(getCell(S.main,g,d,x,y),vs);if((d.min!=null&&p<+d.min)||(d.max!=null&&p>+d.max))n++}
  return n?`Внимание: ${n} ячеек вне пределов, заданных в описании (${d.min??'—'}…${d.max??'—'}). Они выделены красным.`:null;
}
function bindMap(){
  const tb=$('#grid'); if(!tb) return;
  $('#tRaw').onchange=e=>{S.raw=e.target.checked;renderEditor()};
  $('#tPct').onchange=e=>{S.diffPct=e.target.checked;renderEditor()};
  $('#oAll').onclick=()=>{const g=geom(S.cur,S.main);S.sel={x0:0,x1:g.nx-1,y0:0,y1:g.ny-1};renderEditor()};
  document.querySelectorAll('.ops [data-op]').forEach(b=>b.onclick=()=>applyOp(b.dataset.op));
  let anchor=null,drag=false;
  const cell=e=>e.target.closest('td[data-x]');
  tb.addEventListener('mousedown',e=>{const c=cell(e);if(!c||e.target.tagName==='INPUT')return;const x=+c.dataset.x,y=+c.dataset.y;
    if(e.shiftKey&&S.sel){anchor=anchor||{x:S.sel.x0,y:S.sel.y0}}else anchor={x,y};
    drag=true;setSel(anchor,{x,y});e.preventDefault()});
  tb.addEventListener('mouseover',e=>{if(!drag)return;const c=cell(e);if(c)setSel(anchor,{x:+c.dataset.x,y:+c.dataset.y})});
  window.onmouseup=()=>{if(drag){drag=false;renderEditor()}};
  tb.addEventListener('dblclick',e=>{const c=cell(e);if(!c)return;inlineEdit(c)});
}
function setSel(a,b){S.sel={x0:Math.min(a.x,b.x),x1:Math.max(a.x,b.x),y0:Math.min(a.y,b.y),y1:Math.max(a.y,b.y)};
  document.querySelectorAll('#grid td[data-x]').forEach(td=>{const x=+td.dataset.x,y=+td.dataset.y;td.classList.toggle('sel',x>=S.sel.x0&&x<=S.sel.x1&&y>=S.sel.y0&&y<=S.sel.y1)})}
function inlineEdit(td){
  const d=S.cur,g=geom(d,S.main),x=+td.dataset.x,y=+td.dataset.y; const vs=S.raw?{scale:1,offset:0}:(d.v||{});
  const v=getCell(S.main,g,d,x,y); const inp=document.createElement('input'); inp.value=S.raw?v:fmt(phys(v,vs),vs);
  td.textContent='';td.appendChild(inp);inp.focus();inp.select();
  const done=ok=>{if(ok){const p=parseFloat(inp.value.replace(',','.').replace('−','-'));if(isFinite(p)){const nv=toRaw(p,vs);
      if((d.signed&&(nv<-32768||nv>32767))||(!d.signed&&(nv<0||nv>65535))){alert('Вне диапазона 16 бит');}
      else writeWords([{a:cellAddr(g,x,y),v:nv}],`${d.addr} [${x},${y}] = ${p}`);}}
    S.sel={x0:x,x1:x,y0:y,y1:y};renderAll();const lim=limitHits(d);if(ok&&lim)alert(lim)};
  inp.onkeydown=e=>{if(e.key==='Enter')done(true);if(e.key==='Escape')done(false)};
  inp.onblur=()=>done(true);
}

/* ---------- scalars ---------- */
function scalarView(){
  const items=S.defs.items.filter(d=>d.kind==='scalar');
  const q=$('#q').value.trim().toLowerCase();
  let r='';
  for(const d of items){
    if(q&&!(d.addr+' '+d.name).toLowerCase().includes(q))continue;
    const a=parseAddr(d.addr); const v=rd(S.main,a,d.signed); const c=S.cmp?rd(S.cmp,a,d.signed):null; const vs=d.v||{};
    const show=x=>d.hex?(x&0xFFFF).toString(16).toUpperCase().padStart(4,'0'):fmt(phys(x,vs),vs);
    const ch=c!==null&&c!==v;
    r+=`<tr ${S.cur===d?'style="background:var(--accent-soft)"':''}><td class="n">${d.addr}</td><td>${esc(d.name)}<div class="note">${esc(d.note||'')}</div></td>
      <td class="n"${ch?' style="color:var(--chg);font-weight:700"':''}>${show(v)} ${esc(vs.unit||'')}<div class="note">сырое ${d.hex?'0x'+show(v):v}</div></td><td class="n">${c===null?'—':show(c)}</td>
      <td><div class="row"><input data-in="${d.addr}" placeholder="${d.hex?'hex':'новое'}" style="width:90px"><button data-w="${d.addr}">Записать</button><button data-e="${d.addr}">Описание</button></div></td></tr>`;
  }
  return `<div class="card"><h2>Отдельные значения</h2><div class="note">Не карты, а одиночные константы калибровки. Значение вводится в показанных единицах; маска — в hex.</div>
   <div style="overflow:auto"><table class="t"><tr><th>Адрес</th><th>Что это</th><th>Сейчас</th><th>В сравнении</th><th></th></tr>${r}</table></div></div>`+(S.cur&&S.cur.kind==='scalar'?defForm(S.cur):'');
}
function bindScalars(){
  document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{
    const d=defByAddr(parseAddr(b.dataset.w)); const inp=document.querySelector(`[data-in="${b.dataset.w}"]`); const s=inp.value.trim(); if(!s)return;
    let nv; if(d.hex){nv=parseAddr(s);} else {const p=parseFloat(s.replace(',','.').replace('−','-')); if(!isFinite(p)){alert('Введите число');return} nv=toRaw(p,d.v||{});}
    if(!isFinite(nv)){alert('Неверное значение');return}
    if((d.signed&&(nv<-32768||nv>32767))||(!d.signed&&(nv<0||nv>65535))){alert('Вне диапазона 16 бит');return}
    const p=phys(nv,d.v||{}); if((d.min!=null&&p<+d.min)||(d.max!=null&&p>+d.max)){ if(!confirmInline(`Значение вне пределов описания (${d.min??'—'}…${d.max??'—'}). Всё равно записать?`))return }
    if(writeWords([{a:parseAddr(d.addr),v:nv}],`${d.addr} = ${s}`)) renderAll();
  });
  document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{S.cur=defByAddr(parseAddr(b.dataset.e));S.editDef=true;renderEditor()});
  bindDefForm();
}
function confirmInline(msg){return window.confirm(msg)}

/* ---------- temp (scan hit without definition) ---------- */
function tempView(g){
  const fake={addr:hex(g.h),kind:g.kind,name:'Без описания',conf:'L',signed:false,x:{},y:{},v:{}};
  S.cur=null;
  let rows='';for(let x=0;x<g.nx;x++){rows+=`<tr><th class="rh">${g.X[x]}</th>`;for(let y=0;y<g.ny;y++)rows+=`<td>${getCell(S.main,g,fake,x,y)}</td>`;rows+='</tr>'}
  return `<div class="card"><h2>${hex(g.h)} <span class="pill new">без описания</span></h2>
   <div class="meta"><span>${g.kind} ${g.nx}×${g.ny}</span><span>данные ${hex(g.data)}</span><span>Titanium: ${hex(g.data-2)}</span><span>ID оси X ${hex(g.xv,4)}</span>${g.yv!=null?`<span>ID оси Y ${hex(g.yv,4)}</span>`:''}</div>
   <div class="row"><button class="pri" id="tAdd">Добавить в описания</button></div>
   <div class="gridwrap"><table class="g"><tr><th class="corner">сырые</th>${g.Y?g.Y.map(v=>`<th>${v}</th>`).join(''):'<th>значение</th>'}</tr>${rows}</table></div></div>`;
}
function bindTemp(){$('#tAdd').onclick=()=>addDef({addr:hex(S.temp.h),kind:S.temp.kind,name:'',conf:'L',signed:false,x:{unit:'',scale:1,offset:0},y:S.temp.Y?{unit:'',scale:1,offset:0}:null,v:{unit:'',scale:1,offset:0},note:''})}

/* ---------- add map ---------- */
function addMapCard(){
  return `<div class="card"><h3>Добавить карту или значение</h3>
   <div class="row"><label for="aAddr">Адрес</label><input id="aAddr" class="mono" placeholder="например 3BB40" style="width:120px">
     <select id="aSrc"><option value="any">как есть (заголовок или данные)</option><option value="tit">из Titanium/WinOLS (данные −2)</option></select>
     <button id="aFind">Найти карту</button><button id="aScal">Добавить как одиночное значение</button></div>
   <div class="row note">Без заголовка: <label>данные с <input id="aRaw" class="mono" style="width:90px"></label><label>X <input id="aNx" style="width:50px"></label><label>Y <input id="aNy" style="width:50px"></label><button id="aRawBtn">Добавить как таблицу без осей</button></div>
   <div id="aOut"></div></div>`;
}
function bindAdd(){
  const out=$('#aOut'); if(!out) return;
  $('#aFind').onclick=()=>{
    if(!S.main){out.innerHTML='<div class="warn">Сначала откройте прошивку</div>';return}
    let a=parseAddr($('#aAddr').value); if(!isFinite(a)){out.innerHTML='<div class="warn">Неверный адрес</div>';return}
    if($('#aSrc').value==='tit') a+=2;
    let g=parseHeader(S.main,a), how='заголовок по этому адресу';
    if(!g){for(let h=a-2;h>=Math.max(CAL_LO,a-0x120);h-=2){const t=parseHeader(S.main,h);if(t&&t.data===a){g=t;how='адрес — начало данных, заголовок найден выше';break}}}
    if(!g){for(let h=a-2;h>=Math.max(CAL_LO,a-0x400);h-=2){const t=parseHeader(S.main,h);if(t&&t.data<=a&&t.end>a){g=t;how='адрес внутри данных карты';break}}}
    if(!g){out.innerHTML='<div class="warn">Заголовок карты не найден. Если это таблица без осей — используйте строку «Без заголовка», если одно число — «одиночное значение».</div>';return}
    const ex=defByAddr(g.h);
    out.innerHTML=`<div class="info">${how}: заголовок <b class="mono">${hex(g.h)}</b>, ${g.kind} ${g.nx}×${g.ny}, данные ${hex(g.data)}–${hex(g.end-1)}, ось X ${g.X[0]}…${g.X[g.nx-1]}${g.Y?', ось Y '+g.Y[0]+'…'+g.Y[g.ny-1]:''}.</div>`+
      (ex?`<div class="row"><span>Уже описана: ${esc(ex.name)}</span><button id="aGo">Открыть</button></div>`:`<div class="row"><button class="pri" id="aAdd">Добавить</button></div>`);
    if(ex) $('#aGo').onclick=()=>{S.tab='maps';S.cur=ex;S.temp=null;renderAll()};
    else $('#aAdd').onclick=()=>addDef({addr:hex(g.h),kind:g.kind,name:'',conf:'L',signed:false,x:{unit:'',scale:1,offset:0},y:g.Y?{unit:'',scale:1,offset:0}:null,v:{unit:'',scale:1,offset:0},note:''});
  };
  $('#aScal').onclick=()=>{let a=parseAddr($('#aAddr').value);if(!isFinite(a)||a%2||a<CAL_LO||a>=CAL_HI){out.innerHTML='<div class="warn">Адрес должен быть чётным и внутри 0x38000–0x3FFFF</div>';return}
    if($('#aSrc').value==='tit') a+=0; addDef({addr:hex(a),kind:'scalar',name:'',conf:'L',signed:true,v:{unit:'',scale:1,offset:0},note:''})};
  $('#aRawBtn').onclick=()=>{const a=parseAddr($('#aRaw').value),nx=parseInt($('#aNx').value),ny=parseInt($('#aNy').value)||1;
    if(!isFinite(a)||a%2||a<CAL_LO||a+2*nx*ny>CAL_HI||!(nx>0)){out.innerHTML='<div class="warn">Проверьте адрес и размеры (адрес чётный, внутри калибровки)</div>';return}
    addDef({addr:hex(a),kind:'raw',nx,ny,name:'',conf:'L',signed:false,x:{unit:'',scale:1,offset:0},y:ny>1?{unit:'',scale:1,offset:0}:null,v:{unit:'',scale:1,offset:0},note:''})};
}
function addDef(d){
  if(defByAddr(parseAddr(d.addr))){alert('Описание с этим адресом уже есть');return}
  S.defs.items.push(d); sortDefs(); saveDefsLS(); checkOverlaps(); S.scan=null;
  S.cur=d; S.temp=null; S.editDef=true; S.tab=d.kind==='scalar'?'scal':'maps'; markTabs();
  if(overlapWarn.length) alert('Внимание: описания перекрываются: '+overlapWarn.join('; '));
  renderAll();
}

/* ---------- definition form ---------- */
function axForm(id,s,label){s=s||{};return `<span>${label}</span><div class="axrow"><input id="${id}u" placeholder="единица" value="${esc(s.unit||'')}"><input id="${id}s" placeholder="делитель" value="${s.scale??1}"><input id="${id}o" placeholder="смещение" value="${s.offset??0}"></div>`}
function defForm(d){
  if(!S.editDef) return `<div class="card"><div class="row" style="justify-content:space-between"><h3>Описание</h3><button id="dOpen">Изменить описание</button></div></div>`;
  return `<div class="card"><h3>Описание ${d.addr}</h3>
  <div class="form">
   <label for="dAddr">Адрес${d.kind==='scalar'||d.kind==='raw'?' (данные)':' (заголовок)'}</label><input id="dAddr" class="mono" value="${d.addr}">
   <label for="dName">Название</label><input id="dName" value="${esc(d.name||'')}">
   <label for="dConf">Уверенность</label><select id="dConf">${['H','M','L'].map(c=>`<option ${d.conf===c?'selected':''}>${c}</option>`).join('')}</select>
   <label for="dSigned">Знаковые числа</label><select id="dSigned"><option value="1" ${d.signed?'selected':''}>да (−32768…32767)</option><option value="0" ${!d.signed?'selected':''}>нет (0…65535)</option></select>
   ${d.kind==='raw'?`<label>Размер X × Y</label><div class="axrow"><input id="dNx" value="${d.nx}"><input id="dNy" value="${d.ny}"><span></span></div>`:''}
   ${axForm('dv',d.v,'Значения: ед. / делитель / смещение')}
   ${d.kind!=='scalar'?axForm('dx',d.x,'Ось X: ед. / делитель / смещение'):''}
   ${d.kind==='2D'||(d.kind==='raw'&&d.ny>1)?axForm('dy',d.y,'Ось Y: ед. / делитель / смещение'):''}

function bindDefForm(){
  const o=$('#dOpen'); if(o){o.onclick=()=>{S.editDef=true;renderEditor()};return}
  if(!$('#dSave')) return;
  const d=S.cur;
  const num=(id,def)=>{const v=$(id).value.trim().replace(',','.').replace('−','-');return v===''?def:+v};
  const ax=id=>({unit:$('#'+id+'u').value.trim(),scale:num('#'+id+'s',1)||1,offset:num('#'+id+'o',0)||0});
  $('#dSave').onclick=()=>{
    const na=parseAddr($('#dAddr').value); if(!isFinite(na)||na%2||na<CAL_LO||na>=CAL_HI){alert('Адрес должен быть чётным и внутри 0x38000–0x3FFFF');return}
    const other=defByAddr(na); if(other&&other!==d){alert('Такой адрес уже описан');return}
    const nd=Object.assign({},d,{addr:hex(na),name:$('#dName').value.trim(),conf:$('#dConf').value,signed:$('#dSigned').value==='1',v:ax('dv'),note:$('#dNote').value.trim()});
    if($('#dxu')) nd.x=ax('dx'); if($('#dyu')) nd.y=ax('dy');
    if($('#dNx')){nd.nx=parseInt($('#dNx').value);nd.ny=parseInt($('#dNy').value)||1}
    if($('#dHex')) nd.hex=$('#dHex').value==='1';
    const mn=num('#dMin',null), mx=num('#dMax',null); if(mn==null)delete nd.min;else nd.min=mn; if(mx==null)delete nd.max;else nd.max=mx;
    if(nd.kind==='2D'||nd.kind==='1D'){const g=parseHeader(S.main||new Uint8Array(FSIZE),na);if(S.main&&!g){alert('По этому адресу нет заголовка карты');return} if(g) nd.kind=g.kind}
    Object.keys(d).forEach(k=>delete d[k]); Object.assign(d,nd);
    sortDefs(); saveDefsLS(); checkOverlaps(); S.editDef=false; S.scan=null;
    if(overlapWarn.length) alert('Внимание: описания перекрываются: '+overlapWarn.join('; '));
    renderAll();
  };
  $('#dCancel').onclick=()=>{S.editDef=false;renderEditor()};
  $('#dDel').onclick=()=>{if(!confirmInline('Удалить описание '+d.addr+'? Данные в прошивке не меняются.'))return;S.defs.items.splice(S.defs.items.indexOf(d),1);saveDefsLS();checkOverlaps();S.cur=null;S.editDef=false;S.scan=null;renderAll()};
}

/* ---------- log ---------- */
function logView(){
  if(!S.log.length) return '<div class="card"><h2>Журнал</h2><div class="note">Изменений в этой сессии нет.</div></div>';
  return `<div class="card"><h2>Журнал правок этой сессии</h2><div style="overflow:auto"><table class="t"><tr><th>Время</th><th>Действие</th><th>Слов</th><th>Детали</th></tr>${S.log.map(e=>`<tr><td class="n">${e.t}</td><td>${esc(e.label)}</td><td class="n">${e.n}</td><td class="n" style="font-size:11.5px">${e.detail.slice(0,6).map(c=>hex(c.a)+': '+c.old+'→'+c.nv).join('<br>')}${e.detail.length>6?'<br>…':''}</td></tr>`).join('')}</table></div></div>`;
}

/* ---------- files ---------- */
function readFile(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(new Uint8Array(r.result));r.onerror=()=>rej(r.error);r.readAsArrayBuffer(f)})}
function download(name,data,type){const b=new Blob([data],{type});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},1000)}
$('#fMain').onchange=async e=>{const f=e.target.files[0];if(!f)return;const b=await readFile(f);
  if(b.length!==FSIZE&&!confirmInline(`Размер ${b.length} байт, ожидается ${FSIZE}. Всё равно открыть?`))return;
  S.main=b;S.mainName=f.name;S.undo=[];S.scan=null;S.log.push({t:new Date().toLocaleTimeString(),label:'Открыт '+f.name,n:0,first:0,detail:[]});
  const sw=detectEcu(b); if(!S.cmp&&!sw) setStatus('Совет: откройте стоковый файл в «Сравнить с», чтобы видеть изменения'); checkOverlaps(); renderAll()};
$('#fCmp').onchange=async e=>{const f=e.target.files[0];if(!f)return;S.cmp=await readFile(f);S.cmpName=f.name;renderAll()};
$('#fDefs').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{loadDefs(JSON.parse(new TextDecoder().decode(await readFile(f))),'описания загружены из '+f.name);renderAll()}catch(err){alert('Не удалось загрузить описания: '+err.message)}};

$('#bDefsReset').onclick=()=>{if(!confirmInline('Заменить текущие описания встроенными? Ваши добавленные описания пропадут (сохраните их перед этим).'))return;loadDefs(builtinDefs(),'встроенные описания');renderAll()};
$('#bUndo').onclick=()=>undoN(1);
$('#bChk').onclick=()=>recalcChecksum(false);
$('#bChkCheck').onclick=()=>recalcChecksum(true);
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();undo()}});
$('#bSave').onclick=()=>{if(!S.main){alert('Нет открытого файла');return}
  const m=S.mainName.match(/^(.*?)(\.[^.\/\\]{1,8})?$/); const nm=m[1]+'_edit'+(m[2]||'');
  let warn='';
  try{const {blocks}=ckScan();const bad=blocks.filter(b=>{const [A,B]=ckCompute(S.main,b.start,b.C);return A!==U16(S.main,b.C)||B!==U16(S.main,b.C+2)});if(bad.length)warn='\n\nВНИМАНИЕ: контрольная сумма НЕ пересчитана. Нажмите «Пересчитать сумму» перед заливкой.';}catch(e){}
  download(nm,S.main,'application/octet-stream');
  alert('Файл сохранён как '+nm+'.\nСумма байт (Galletto): '+sum16(S.main).toString(16).toUpperCase().padStart(4,'0')+warn)};
$('#bCsv').onclick=()=>{
  if(!S.main||!S.cmp){alert('Нужны оба файла: прошивка и файл сравнения');return}
  const lines=['адрес;карта;название;x;y;было;стало;было_физ;стало_физ;изменение_%'];
  const covered=new Set();
  for(const d of S.defs.items){const g=geom(d,S.main);if(!g)continue;
    for(let x=0;x<g.nx;x++)for(let y=0;y<g.ny;y++){const a=d.kind==='scalar'?g.data:cellAddr(g,x,y);covered.add(a);covered.add(a+1);
      const o=rd(S.cmp,a,d.signed),n=rd(S.main,a,d.signed);if(o===n)continue;const vs=d.v||{};
      const xa=g.X?(S.raw?g.X[x]:fmt(phys(g.X[x],d.x||{}),d.x||{})):'',ya=g.Y?fmt(phys(g.Y[y],d.y||{}),d.y||{}):'';
      lines.push([hex(a),d.addr,'"'+(d.name||'').replace(/"/g,"'")+'"',xa,ya,o,n,fmt(phys(o,vs),vs),fmt(phys(n,vs),vs),o?((n/o-1)*100).toFixed(2):''].join(';'))}}
  for(let a=0;a<S.main.length;a+=2){if(covered.has(a))continue;if(S.main[a]!==S.cmp[a]||S.main[a+1]!==S.cmp[a+1])lines.push([hex(a),'(без описания)','','','',U16(S.cmp,a),U16(S.main,a),'','',''].join(';'))}
  download(S.mainName.replace(/\.[^.]{1,8}$/,'')+'_changes.csv','﻿'+lines.join('\r\n'),'text/csv')};

['#q','#qConf','#qChg'].forEach(s=>$(s).addEventListener('input',()=>{renderList();if(S.tab==='scal')renderEditor()}));
